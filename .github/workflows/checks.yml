name: Interface and release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install ipi==3.2.0 numpy==2.2.6 scipy==1.15.3
      - name: Check source and download integrity
        run: python scripts/check_release.py
      - name: Check clean and resumed eT source generation
        run: python scripts/check_et_generation.py
      - name: Prepare executable test fixtures
        run: chmod +x workflow/tests/*.py examples/monomer-pimd/tests/*.py
      - name: Run workstation interface tests
        working-directory: workflow
        run: python -m unittest discover -s tests -v
      - name: Run preserved monomer driver tests
        working-directory: examples/monomer-pimd
        run: python -m unittest discover -s tests -v
